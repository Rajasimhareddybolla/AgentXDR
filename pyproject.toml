[build-system]
requires = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agentxdr-core"
version = "0.1.0"
description = "Production-grade core engine and deterministic guardrails for AgentXDR"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.10.0",
    "pyyaml>=6.0.0",
    "regex>=2024.0.0",
    "fastapi>=0.115.0",
    "httpx>=0.27.0",
    "starlette>=0.40.0",
    "cryptography>=42.0.0",
    "opentelemetry-api>=1.25.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[project.scripts]
agentxdr = "agentxdr.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
asyncio_mode = "auto"
