name: AgentXDR PR Security & Policy Guard

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]

permissions:
  contents: read
  pull-requests: write

jobs:
  agentxdr-security-gate:
    name: Policy Diff, Dependency Audit, Red-Team & Test Suite
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install AgentXDR & dev dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]" duckdb pyyaml networkx pyrit mcp uvicorn

      - name: Run full AgentXDR test suite
        run: pytest tests/

      - name: Check Policy PR Weakening Regressions
        id: policy_diff
        if: github.event_name == 'pull_request'
        run: |
          BASE_REF="origin/${{ github.base_ref }}"
          CHANGED_POLICIES=$(git diff --name-only "$BASE_REF"...HEAD -- '*policy*.yaml' '*policy*.yml' || true)
          echo "changed=$CHANGED_POLICIES" >> $GITHUB_OUTPUT
          REPORT_FILE="policy_diff_report.md"
          echo "" > "$REPORT_FILE"
          REGRESSION=0
          for FILE in $CHANGED_POLICIES; do
            if git cat-file -e "$BASE_REF:$FILE" 2>/dev/null && [ -f "$FILE" ]; then
              git show "$BASE_REF:$FILE" > /tmp/base_policy.yaml
              if ! python3 -m agentxdr.cli policy diff /tmp/base_policy.yaml "$FILE" --format markdown >> "$REPORT_FILE"; then
                REGRESSION=1
              fi
              echo "" >> "$REPORT_FILE"
            fi
          done
          echo "regression=$REGRESSION" >> $GITHUB_OUTPUT
          if [ "$REGRESSION" -ne 0 ]; then
            echo "::error::Policy-weakening regressions detected in Pull Request."
            exit 1
          fi

      - name: Post Policy Diff Summary on Pull Request
        if: always() && github.event_name == 'pull_request' && steps.policy_diff.outputs.changed != ''
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const body = fs.readFileSync('policy_diff_report.md', 'utf8').trim();
            if (!body) return;
            const marker = '<!-- agentxdr-policy-pr-guard -->';
            const fullBody = `${marker}\n${body}`;
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find(c => c.body && c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body: fullBody,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: fullBody,
              });
            }

      - name: Scan Project & MCP Dependencies (Offline)
        run: python3 -m agentxdr.cli deps scan --path . --offline --format text

      - name: Run Pre-Deployment Red-Team Gate (Offline)
        run: python3 -m agentxdr.cli redteam --mode offline --min-score 0.95
